<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roblox Prototype</title>
<style>
	:root { --hud-bg: rgba(0, 0, 0, 0.55); --hud-fg: #f2f2f2; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc4ec; overscroll-behavior: none; }
	body { font: 13px/1.4 system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
	#viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
	#hud { position: fixed; left: 8px; top: 8px; padding: 8px 10px; background: var(--hud-bg); color: var(--hud-fg);
		font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; border-radius: 6px; pointer-events: none; max-width: calc(100vw - 32px); overflow: hidden; }
	#hint { position: fixed; left: 8px; bottom: 8px; color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 2px #0008; pointer-events: none; }
	#panel { position: fixed; right: 8px; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }
	#mouse-lock-cursor { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none;
		border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 2px #000, inset 0 0 2px #000; }
	#mouse-lock-cursor[data-icon="cross"] { border: 0; box-shadow: none; background:
		linear-gradient(#fff, #fff) center / 2px 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 2px no-repeat; }
	#TouchGui, #TouchControlFrame { position: fixed; inset: 0; pointer-events: none; }
	#JumpButton { position: absolute; border-radius: 50%; background: rgba(0, 0, 0, 0.3); border: 3px solid rgba(255, 255, 255, 0.75); box-sizing: border-box; pointer-events: auto; }
	#JumpButton::after { content: ""; position: absolute; inset: 30% 28% 34%; background: rgba(255, 255, 255, 0.85);
		clip-path: polygon(50% 0, 100% 60%, 70% 60%, 70% 100%, 30% 100%, 30% 60%, 0 60%); }
	#JumpButton.pressed { background: rgba(255, 255, 255, 0.35); }
	[hidden] { display: none !important; }
	@media (pointer: coarse) { #hint { display: none; } }
</style>
<script type="importmap">
{
	"imports": {
		"three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js",
		"lil-gui": "https://cdnjs.cloudflare.com/ajax/libs/lil-gui/0.19.2/lil-gui.esm.min.js"
	}
}
</script>
</head>
<body>
<canvas id="viewport"></canvas>
<div id="hud" hidden></div>
<div id="hint">WASD move · Space jump · RMB drag orbit · wheel zoom · Shift lock · F3 debug</div>
<div id="panel" data-panel data-sink-input></div>
<div id="mouse-lock-cursor" hidden></div>
<div id="TouchGui" hidden><div id="TouchControlFrame"></div></div>
<script type="module" src="scripts/main.js"></script>
</body>
</html>
